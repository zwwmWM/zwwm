name: packages

# Runs for release tags such as 0.2.0-alpha.2; the manual trigger builds without publishing.
# Every directory under packaging/ with an image file is one distribution.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dists:
    name: list distributions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          entries=()
          for dir in packaging/*/; do
            [[ -f ${dir}image ]] || continue
            entries+=("{\"name\":\"$(basename "$dir")\",\"image\":\"$(tr -d '[:space:]' < "${dir}image")\"}")
          done
          (IFS=,; echo "matrix={\"include\":[${entries[*]}]}" >> "$GITHUB_OUTPUT")

  build:
    name: ${{ matrix.name }}
    needs: dists
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dists.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sh packaging/${{ matrix.name }}/deps.sh
      - name: Check the tag matches .version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < .version)
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match .version ($version)"
            exit 1
          fi
      - name: Build package
        run: bash packaging/build.sh ${{ matrix.name }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: zwwm-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    # Publishes whichever distributions built, even if another one failed.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach packages to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md." "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
